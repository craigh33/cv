name: Build and Release CV

on:
  schedule:
    - cron: '17 9 1 * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      tag:
        description: 'Git tag name'
        required: true
        default: 'v1.0.0'

concurrency:
  group: cv-release-${{ inputs.tag || 'monthly' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set monthly release version
        if: github.event_name == 'schedule'
        id: monthly
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/London
        run: |
          created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          version=$(date --date="$created_at" +%Y-%m)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cv-$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(date --date="$created_at" +%s)" >> "$GITHUB_ENV"
          echo "FORCE_SOURCE_DATE=1" >> "$GITHUB_ENV"
      
      - name: Install TeX Live with LuaLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-extra
      
      - name: Build PDF using Makefile
        run: |
          make build
      
      - name: Verify PDF exists
        run: |
          if [ ! -s output/cv.pdf ]; then
            echo "Error: PDF was not generated"
            exit 1
          fi
          echo "PDF size: $(ls -lh output/cv.pdf | awk '{print $5}')"
          echo "PDF generated successfully!"
      
      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || steps.monthly.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CV Release ${{ inputs.version || steps.monthly.outputs.version }}
          body: |
            CV Release ${{ inputs.version || steps.monthly.outputs.version }}
            
            Built on ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: output/cv.pdf
